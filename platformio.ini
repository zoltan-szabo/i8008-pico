[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
; No ports pinned here: /dev/cu.usbmodemXXXX names follow the USB socket.
; Upload auto-detects the rig by USB identity (plain Pico 2E8A:000A; the
; Pico W 2E8A:F00A on this machine never matches the 'pico' board manifest).
; For the console use ./monitor, which resolves the port the same way.
extra_scripts = pre:pre_build.py
